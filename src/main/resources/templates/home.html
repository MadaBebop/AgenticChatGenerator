<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>UniUd chat</title>
    <link rel="stylesheet" href="/static/css/main.css">

</head>
<body>
<script src="/js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <div id="user-page">
        <div class="user-page-container">
            <h1 class="title">Inserisci il tuo nome</h1>
            <form id="user-form" name="user-form">
                <div class="form-group">
                    <input type="text" id="name" placeholder="il tuo nome" autocomplete="off" class="form-control" />
                </div>
                <div class="form-group">
                    <button type="submit" class="accent user-submit">Inizia a chattare!</button>
                </div>
            </form>
        </div>
    </div>
    <!-- Chat (inizialmente nascosta) -->
    <div id="chat-page" class="hidden">
        <div class="chat-container">
            <div class="chat-header">
                <h2>UniUd Chat</h2>
            </div>
            <div class="connecting">  <!-- Verrà poi inserito il nome   -->
                Connessione...
            </div>
            <ul id="message-area">

            </ul>
            <form id="message-form" name="message-form">
                <div class="form-group">
                    <div class="input-group clearfix">
                        <input type="text" id="message" placeholder="Scrivi qualcosa..." autocomplete="off" class="form-control"/>
                        <button type="submit" class="primary">Send</button>
                    </div>
                </div>
            </form>
        </div>
    </div>


<noscript>
    <h2 style="color: #ff0000">
        Sembra che il tuo browser non supporti Javascript! Websocket deve avere Javascript abilitato per funzionare.
        Per favore abilita Javascript e ricarica questa pagina!
    </h2>
</noscript>

</body>
</html>
